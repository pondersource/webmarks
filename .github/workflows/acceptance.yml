name: remoteStorage acceptance

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  webmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/acceptance/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/acceptance
      - run: npx --prefix tests/acceptance playwright install --with-deps chromium
      - run: npm --prefix tests/acceptance test
