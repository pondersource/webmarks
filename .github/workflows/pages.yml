name: Deploy Ponder Source app
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --environment=production
      - uses: actions/checkout@v4
        with:
          repository: pondersource/remotestorage.js
          ref: 607acc5a474c28e08ca3836de71d20c9bdff7ca1
          path: atomic-storage-source
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: fb640fb54657ef826db8ec7ca55e24587faab1da
          path: atomic-sdk-source
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: atomic-sdk-source/browser/package.json

      - run: pnpm install --frozen-lockfile && pnpm --filter @tomic/utils build
        working-directory: atomic-sdk-source/browser

      - run: node atomic-storage-source/scripts/build-atomic-sdk.mjs atomic-sdk-source dist/atomic-sdk

      - name: Prepare custom domain and client routes
        run: |
          printf '%s\n' 'webmarks.pondersource.com' > dist/CNAME
          cp dist/index.html dist/404.html
          cp -R atomic dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
